[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-presession-briefing"
version = "0.2.0"
description = "Tilt Guard pre-session briefing package"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.12,<7",
  "requests>=2.32,<3",
  "yfinance>=0.2.66,<2",
]

[project.optional-dependencies]
charts = [
  "matplotlib>=3.10,<4",
  "mplfinance>=0.12.10b0,<1",
]
