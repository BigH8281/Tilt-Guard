<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pre-Session Briefing</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="layout">
      <section class="hero">
        <p class="eyebrow">Standalone Market Tool</p>
        <h1>Pre-Session Briefing</h1>
        <p class="subhead">
          Futures-focused daily macro and news briefing for UK100, NQ, and MES with session-aware context.
        </p>
        <div class="hero-actions">
          <button id="generateLiveButton" class="primary">Generate Live Briefing</button>
          <button id="reloadButton" class="secondary">Load Sample</button>
        </div>
        <p id="status" class="status">Ready to fetch live data.</p>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Briefing Output</h2>
        </div>
        <div id="summaryCards" class="cards"></div>
        <div id="scoreCards" class="cards cards-compact"></div>
        <section id="narrativePanel" class="narrative-panel"></section>
        <div class="body-grid">
          <section class="glass-section">
            <div class="section-label">Bias Matrix</div>
            <div id="biasTable" class="table-wrap"></div>
            <div id="guidancePanel" class="guidance-panel"></div>
          </section>
          <section class="glass-section">
            <div class="section-label">Dashboard</div>
            <div id="dashboardPanel" class="dashboard"></div>
          </section>
        </div>
        <div id="playbook" class="playbook"></div>
        <section class="glass-section">
          <div class="section-row">
            <div class="section-label">Technical Snapshot</div>
            <div id="chartTabs" class="chart-tabs"></div>
          </div>
          <div id="chartStrip" class="chart-strip"></div>
        </section>
        <section class="glass-section">
          <div class="section-label">Story Breakdown</div>
          <div id="storyStream" class="story-stream"></div>
        </section>
        <details class="raw-panel">
          <summary>Raw JSON</summary>
          <pre id="outputBox"></pre>
        </details>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
